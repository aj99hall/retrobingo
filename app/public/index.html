<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Retro Bingo</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

:root{
  --neon-cyan: #00ffcc;
  --neon-pink: #ff00cc;
  --neon-yellow:#ffff00;
  --link-cyan: #00ffff;
  --muted-pink:#ff66ff;
}

body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background: radial-gradient(circle at top, var(--neon-pink), #1a0033 70%);
  color: var(--neon-cyan);
  font-family:'VT323', monospace;
  letter-spacing:1px;
  text-transform:uppercase;
  position:relative;
  overflow:hidden;
}

/* CRT scanlines */
body::after{
  content:"";
  pointer-events:none;
  position:absolute;
  inset:0;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.05) 0px,
    rgba(255,255,255,0.05) 2px,
    transparent 2px,
    transparent 4px
  );
  opacity:.6;
}

main{
  max-width:720px;
  padding:40px 30px;
}

.card{
  background:rgba(0,0,0,.85);
  border:6px double var(--neon-cyan);
  box-shadow:10px 10px 0 var(--neon-pink);
  padding:30px;
  position:relative;
  z-index:1;
}

h1{
  margin:0 0 20px;
  font-family:'Press Start 2P', cursive;
  font-size:36px;
  color:var(--neon-yellow);
  text-shadow:
    0 0 5px var(--neon-pink),
    0 0 10px var(--neon-pink),
    0 0 20px var(--neon-pink);
}

/* blinking cursor */
h1::after{
  content:"_";
  animation:blink 1s steps(1) infinite;
}
@keyframes blink {50%{opacity:0;}}

p{
  font-size:24px;
  margin:12px 0;
}

.muted{
  color:var(--muted-pink);
}

a{
  color:var(--link-cyan);
  text-decoration:none;
  border-bottom:2px solid var(--link-cyan);
}

/* Retro Game Button */
.start-btn{
  display:inline-block;
  margin-top:40px;
  padding:18px 28px;
  font-family:'Press Start 2P', cursive;
  font-size:14px;
  background:var(--neon-yellow);
  color:#000;
  text-decoration:none;
  border:4px solid #000;
  box-shadow:6px 6px 0 #000;
  transition:all .1s ease;
}

.start-btn:hover{
  background:var(--neon-cyan);
}

.start-btn:active{
  box-shadow:2px 2px 0 #000;
  transform:translate(4px,4px);
}

</style>
</head>

<body>
  <div>
    <main class="card">
      <h1>Retro Bingo</h1>
      <p class="muted">Date • City • Venue</p>
      <p>Coming soon to a retro near you.</p>
      <p>Contact: <a href="mailto:hello@example.com">hello@example.com</a></p>
    </main>

    <!-- Start Game Button BELOW the box -->
    <div style="text-align:center;">
      <a href="details.html" class="start-btn">Start Game</a>
    </div>
  </div>
</body>
</html>
