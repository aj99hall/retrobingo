<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Retro Bingo</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { max-width: 720px; padding: 40px 20px; }
      h1 { margin: 0 0 10px; font-size: 44px; }
      p { margin: 10px 0; font-size: 18px; line-height: 1.5; }
      .card { border: 1px solid #e5e7eb; border-radius: 16px; padding: 24px; }
      .muted { color: #6b7280; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Retro Bingo</h1>
      <p class="muted">Date • City • Venue</p>
      <p>Coming soon to a retro near you</p>
      <p>Contact: <a href="mailto:hello@example.com">hello@example.com</a></p>
    </main>
  </body>
</html>
