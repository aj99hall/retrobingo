<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Player Details</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:#000;
  color:#00ffcc;
  font-family:'VT323', monospace;
  text-transform:uppercase;
}

.container{
  background:#111;
  border:6px double #00ffcc;
  box-shadow:10px 10px 0 #ff00cc;
  padding:40px;
  width:90%;
  max-width:500px;
}

h1{
  font-family:'Press Start 2P', cursive;
  font-size:20px;
  margin-bottom:30px;
  color:#ffff00;
}

label{
  display:block;
  margin:18px 0 6px;
  font-size:20px;
}

input{
  width:100%;
  padding:10px;
  font-size:18px;
  font-family:'VT323', monospace;
  border:3px solid #00ffcc;
  background:#000;
  color:#00ffcc;
}

button{
  margin-top:30px;
  padding:15px 20px;
  font-family:'Press Start 2P', cursive;
  font-size:12px;
  background:#ffff00;
  border:4px solid #000;
  box-shadow:6px 6px 0 #000;
  cursor:pointer;
}

button:active{
  box-shadow:2px 2px 0 #000;
  transform:translate(4px,4px);
}
</style>
</head>

<body>
  <div class="container">
    <h1>Enter Player Data</h1>

    <form>
      <label>Name</label>
      <input type="text" required>

      <label>Email</label>
      <input type="email" required>

      <label>City</label>
      <input type="text" required>

      <button type="submit">Begin</button>
    </form>
  </div>
</body>
</html>
